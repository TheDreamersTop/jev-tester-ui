<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Tester</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #667085;
  --accent: #3b5bdb; --accent-soft: #e7ecff; --bar: #d5dcf5; --good: #2f9e44; --warn: #e67700; --bad: #c92a2a;
  --code-bg: #f1f3f5; --k: #3b5bdb; --s: #2b8a3e; --n: #c2255c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1a1e24; --line: #2c323b; --text: #e6e9ee; --muted: #8b95a5;
    --accent: #7c95ff; --accent-soft: #232b45; --bar: #2f3a5c; --good: #51cf66; --warn: #ffa94d; --bad: #ff6b6b;
    --code-bg: #14171c; --k: #91a7ff; --s: #8ce99a; --n: #faa2c1;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .spacer { flex: 1; }
label.f { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
textarea, input, select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:disabled { opacity: .6; cursor: wait; }
button.ghost { border-color: transparent; color: var(--muted); padding: 4px 7px; }
button.ghost:hover { color: var(--bad); }
select.inline, header select { width: auto; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12px; }
.q { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 10px; }
.q-head { display: flex; gap: 8px; align-items: center; }
.q-head input { flex: 1; font-family: ui-monospace, Menlo, monospace; }
.badge { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.crit { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; gap: 6px; align-items: start; margin-top: 6px; }
.crit.choice { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) 28px; }
.crit.noul { grid-template-columns: 48px minmax(0, 1fr); }
.crit .lvl { color: var(--muted); font: 12px ui-monospace, Menlo, monospace; padding-top: 8px; text-align: right; }
.crit textarea { min-height: 34px; height: 34px; }
.err { color: var(--bad); white-space: pre-wrap; font: 12px ui-monospace, Menlo, monospace; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.meta b { color: var(--text); font-weight: 600; }
.ans { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; }
.ans-head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.ans-head code { font-weight: 700; }
.ans-q { color: var(--muted); font-size: 12px; margin-bottom: 10px; white-space: pre-wrap; }
.big { font-size: 22px; font-weight: 700; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.hi { color: var(--good); } .mid { color: var(--warn); } .lo { color: var(--bad); }
.bars { margin-top: 10px; display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(80px, 38%) minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 13px; }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .name small { color: var(--muted); }
.bar .track { height: 10px; background: var(--code-bg); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--bar); border-radius: 5px; }
.bar.top .fill { background: var(--accent); }
.bar.top .name { font-weight: 700; }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.scale { position: relative; height: 34px; margin: 14px 6px 2px; }
.scale .line { position: absolute; top: 10px; left: 0; right: 0; height: 4px; background: var(--code-bg); border-radius: 2px; }
.scale .tick { position: absolute; top: 5px; width: 2px; height: 14px; background: var(--line); transform: translateX(-1px); }
.scale .tick span { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
.scale .mark { position: absolute; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); transform: translateX(-9px); box-shadow: 0 0 0 1px var(--accent); }
.gauge { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--bad), var(--warn) 50%, var(--good)); position: relative; margin: 12px 0 4px; opacity: .85; }
.gauge .mark { position: absolute; top: -4px; width: 4px; height: 22px; background: var(--text); border-radius: 2px; transform: translateX(-2px); }
.gauge-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--muted); font-size: 12px; }
pre.json { background: var(--code-bg); border-radius: 6px; padding: 10px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; margin: 6px 0 0; max-height: 420px; }
pre.json .k { color: var(--k); } pre.json .s { color: var(--s); } pre.json .n { color: var(--n); }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Jev Tester</h1>
  <label class="hint" for="preset">Example</label>
  <select id="preset"></select>
  <label class="hint" for="model">Model</label>
  <select id="model"><option>jev-latest</option></select>
  <span class="spacer" style="flex:1"></span>
  <span class="hint">Cmd/Ctrl + Enter to run</span>
  <button id="run" class="primary">Run</button>
</header>

<main>
  <section class="panel">
    <h2>Request <span class="spacer"></span>
      <button id="toggle-json" class="ghost" style="color:var(--accent)">Edit as JSON</button>
    </h2>
    <div id="form-view">
      <label class="f" for="state">State: the text or JSON to judge</label>
      <textarea id="state" rows="6"></textarea>
      <div class="row" style="margin-top:12px">
        <strong style="flex:1">Questions</strong>
        <button data-add="choice">+ Choice</button>
        <button data-add="score">+ Score</button>
        <button data-add="noul">+ Yes/No</button>
      </div>
      <div id="questions"></div>
      <p class="hint">Any text field accepts plain text or JSON. Valid JSON objects and arrays are sent as JSON.</p>
    </div>
    <div id="json-view" hidden>
      <textarea id="json" rows="28" spellcheck="false"></textarea>
      <div id="json-err" class="err"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Answers</h2>
    <div id="out"><div class="empty">Run a request to see answers here.</div></div>
  </section>
</main>

<script>
const PRESETS = {
  "Support triage (all 3 types)": {
    state: "Our API integration started returning 500 errors on every request about 20 minutes ago, and we can't process any customer orders until this is fixed.",
    questions: {
      department: { type: "choice", instructions: "Which team should handle this?", criteria: {
        billing: "Payment or subscription issues", technical: "Bugs or integration problems", sales: "Pricing or account questions" } },
      frustration: { type: "score", instructions: "How frustrated the customer appears", criteria: [
        "Calm, just stating facts", "Frustrated but civil", "Very angry, strong language"] },
      is_urgent: { type: "noul", instructions: "The message conveys urgency or time-sensitivity" },
    },
  },
  "Bug severity (score)": {
    state: "The export button crashes the settings page in Safari. It works in Chrome, but a few of our customers only use Safari.",
    questions: {
      bug_severity: { type: "score", instructions: "How severe is the reported issue?", criteria: [
        "Cosmetic; no impact to functionality", "Broken or degraded feature, but workaround exists", "Blocking issue; no workaround exists"] },
    },
  },
  "Wants a human (yes/no)": {
    state: "I have asked three times now. Can I please just talk to a real person?",
    questions: {
      is_human_escalation: { type: "noul", instructions: "Is the customer asking for a human agent?" },
      is_repeat_contact: { type: "noul", instructions: "Has the customer contacted support about this before?", criteria: {
        true: "Mentions a prior attempt, ticket, or that they have asked before", false: "No sign of any previous contact" } },
    },
  },
  "Blank": { state: "", questions: {} },
};
const TYPE_LABEL = { choice: "Choice", score: "Score", noul: "Yes/No" };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let questions = []; // [{id, type, instructions, criteria}] with criteria as UI-friendly shape

// Text fields hold plain text or JSON. Objects and arrays go out as JSON.
const toField = v => (v === null || v === undefined) ? "" : typeof v === "string" ? v : JSON.stringify(v, null, 2);
function fromField(s) {
  const t = s.trim();
  if (/^[\[{]/.test(t)) { try { return JSON.parse(t); } catch {} }
  return s;
}

function loadRequest(req) {
  $("#state").value = toField(req.state);
  if (req.model) ensureModel(req.model);
  questions = Object.entries(req.questions || {}).map(([id, q]) => {
    let criteria;
    if (q.type === "choice") criteria = Object.entries(q.criteria || {}).map(([k, v]) => [k, toField(v)]);
    else if (q.type === "score") criteria = (q.criteria || []).map(toField);
    else criteria = { true: toField(q.criteria?.true), false: toField(q.criteria?.false) };
    return { id, type: q.type, instructions: toField(q.instructions), criteria };
  });
  renderQuestions();
}

function buildRequest() {
  const out = { state: fromField($("#state").value), model: $("#model").value, questions: {} };
  for (const q of questions) {
    const item = { type: q.type, instructions: fromField(q.instructions) };
    if (q.type === "choice") item.criteria = Object.fromEntries(q.criteria.filter(([k]) => k.trim()).map(([k, v]) => [k.trim(), v.trim() ? fromField(v) : null]));
    else if (q.type === "score") item.criteria = q.criteria.filter(v => v.trim()).map(fromField);
    else if (q.criteria.true.trim() || q.criteria.false.trim()) item.criteria = { true: fromField(q.criteria.true), false: fromField(q.criteria.false) };
    out.questions[q.id.trim() || "question"] = item;
  }
  return out;
}

function newQuestion(type) {
  const n = questions.filter(q => q.type === type).length + 1;
  const criteria = type === "choice" ? [["option_a", ""], ["option_b", ""]] : type === "score" ? ["Low", "Medium", "High"] : { true: "", false: "" };
  questions.push({ id: `${type}_${n}`, type, instructions: "", criteria });
  renderQuestions();
}

function renderQuestions() {
  const box = $("#questions");
  box.innerHTML = "";
  questions.forEach((q, qi) => {
    const el = document.createElement("div");
    el.className = "q";
    el.innerHTML = `
      <div class="q-head">
        <span class="badge">${TYPE_LABEL[q.type]}</span>
        <input value="${esc(q.id)}" data-f="id" aria-label="Question ID" title="Question ID. Not sent to the model.">
        <button class="ghost" data-del title="Remove question">✕</button>
      </div>
      <label class="f">Question</label>
      <textarea rows="2" data-f="instructions">${esc(q.instructions)}</textarea>
      <label class="f">${q.type === "choice" ? "Options: name and description" : q.type === "score" ? "Levels, lowest first" : "What yes and no mean (optional)"}</label>
      <div data-crit></div>`;
    const crit = $("[data-crit]", el);
    if (q.type === "choice") {
      q.criteria.forEach(([k, v], i) => crit.insertAdjacentHTML("beforeend", `
        <div class="crit choice"><input value="${esc(k)}" data-ck="${i}" aria-label="Option name">
        <textarea data-cv="${i}" aria-label="Option description">${esc(v)}</textarea>
        <button class="ghost" data-cdel="${i}" title="Remove">✕</button></div>`));
      crit.insertAdjacentHTML("beforeend", `<button data-cadd style="margin-top:6px">+ Option</button>`);
    } else if (q.type === "score") {
      q.criteria.forEach((v, i) => crit.insertAdjacentHTML("beforeend", `
        <div class="crit"><span class="lvl">${i}</span>
        <textarea data-cv="${i}" aria-label="Level ${i}">${esc(v)}</textarea>
        <button class="ghost" data-cdel="${i}" title="Remove">✕</button></div>`));
      crit.insertAdjacentHTML("beforeend", `<button data-cadd style="margin-top:6px">+ Level</button>`);
    } else {
      for (const side of ["true", "false"]) crit.insertAdjacentHTML("beforeend", `
        <div class="crit noul"><span class="lvl">${side === "true" ? "Yes" : "No"}</span>
        <textarea data-side="${side}" aria-label="${side}">${esc(q.criteria[side])}</textarea></div>`);
    }
    el.addEventListener("input", e => {
      const t = e.target;
      if (t.dataset.f) q[t.dataset.f] = t.value;
      else if (t.dataset.ck) q.criteria[+t.dataset.ck][0] = t.value;
      else if (t.dataset.cv && q.type === "choice") q.criteria[+t.dataset.cv][1] = t.value;
      else if (t.dataset.cv) q.criteria[+t.dataset.cv] = t.value;
      else if (t.dataset.side) q.criteria[t.dataset.side] = t.value;
    });
    el.addEventListener("click", e => {
      const t = e.target.closest("button");
      if (!t) return;
      if (t.hasAttribute("data-del")) questions.splice(qi, 1);
      else if (t.hasAttribute("data-cadd")) q.criteria.push(q.type === "choice" ? ["", ""] : "");
      else if (t.dataset.cdel) q.criteria.splice(+t.dataset.cdel, 1);
      else return;
      renderQuestions();
    });
    box.appendChild(el);
  });
  if (!questions.length) box.innerHTML = `<div class="empty">No questions yet. Add one above.</div>`;
}

// JSON view toggle keeps the form and raw JSON in sync.
let jsonMode = false;
$("#toggle-json").onclick = () => {
  if (!jsonMode) {
    $("#json").value = JSON.stringify(buildRequest(), null, 2);
  } else {
    try { loadRequest(JSON.parse($("#json").value)); $("#json-err").textContent = ""; }
    catch (e) { $("#json-err").textContent = "Invalid JSON: " + e.message; return; }
  }
  jsonMode = !jsonMode;
  $("#form-view").hidden = jsonMode;
  $("#json-view").hidden = !jsonMode;
  $("#toggle-json").textContent = jsonMode ? "Edit as form" : "Edit as JSON";
};

function currentRequest() {
  if (!jsonMode) return buildRequest();
  const req = JSON.parse($("#json").value);
  if (!req.model) req.model = $("#model").value;
  return req;
}

function highlight(obj) {
  return esc(JSON.stringify(obj, null, 2)).replace(
    /(&quot;(?:\\.|[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?|true|false|null)\b/g,
    (m, str, colon, lit) => str ? `<span class="${colon ? "k" : "s"}">${str}</span>${colon || ""}` : `<span class="n">${lit}</span>`);
}

const pct = p => `${Math.round(p * 100)}%`;
const band = c => c >= 0.7 ? "hi" : c >= 0.4 ? "mid" : "lo";
const asText = v => v === null || v === undefined ? "" : typeof v === "string" ? v : JSON.stringify(v);

function bars(rows, top) {
  return `<div class="bars">${rows.map(r => `
    <div class="bar ${r.key === top ? "top" : ""}">
      <span class="name" title="${esc(r.label + (r.desc ? ": " + r.desc : ""))}">${esc(r.label)}${r.desc ? ` <small>${esc(r.desc)}</small>` : ""}</span>
      <span class="track"><span class="fill" style="width:${pct(r.p)}"></span></span>
      <span class="pct">${pct(r.p)}</span>
    </div>`).join("")}</div>`;
}

function renderAnswer(id, a, q) {
  const qText = q ? asText(q.instructions) : "";
  let body = "";
  if (a.type === "choice") {
    const rows = Object.entries(a.probabilities || {}).map(([k, p]) => ({ key: k, label: k, p, desc: asText(q?.criteria?.[k]) }))
      .sort((x, y) => y.p - x.p);
    body = `<div class="row"><span class="big">${esc(a.choice)}</span>
      <span class="pill ${band(a.confidence)}">confidence ${pct(a.confidence)}</span></div>${bars(rows, a.choice)}`;
  } else if (a.type === "score") {
    const levels = Object.keys(a.legend || a.probabilities || {}).map(Number).sort((x, y) => x - y);
    const max = Math.max(...levels, 1);
    const top = Object.entries(a.probabilities || {}).sort((x, y) => y[1] - x[1])[0]?.[0];
    const near = a.legend?.[String(Math.round(a.score))];
    body = `<div class="row"><span class="big">${a.score.toFixed(2)}</span><span class="hint">of ${max}</span>
      <span class="pill ${band(a.confidence)}">confidence ${pct(a.confidence)}</span></div>
      ${near ? `<div class="hint">Closest level: ${esc(asText(near))}</div>` : ""}
      <div class="scale"><div class="line"></div>
        ${levels.map(l => `<div class="tick" style="left:${l / max * 100}%"><span>${l}</span></div>`).join("")}
        <div class="mark" style="left:${a.score / max * 100}%" title="${a.score}"></div></div>
      ${bars(levels.map(l => ({ key: String(l), label: `${l}`, p: a.probabilities[String(l)] || 0, desc: asText(a.legend?.[String(l)]) })), top)}`;
  } else if (a.type === "noul") {
    const v = a.noul;
    const word = v >= 0.9 ? "Strong yes" : v >= 0.6 ? "Leans yes" : v > 0.4 ? "Unsure" : v > 0.1 ? "Leans no" : "Strong no";
    body = `<div class="row"><span class="big ${v >= 0.6 ? "hi" : v > 0.4 ? "mid" : "lo"}">${word}</span>
      <span class="hint">${pct(v)} chance of yes</span></div>
      <div class="gauge"><div class="mark" style="left:${v * 100}%"></div></div>
      <div class="gauge-legend"><span>No</span><span>Unsure</span><span>Yes</span></div>`;
  } else {
    body = `<pre class="json">${highlight(a)}</pre>`;
  }
  return `<div class="ans"><div class="ans-head"><code>${esc(id)}</code><span class="badge">${TYPE_LABEL[a.type] || esc(a.type)}</span></div>
    ${qText ? `<div class="ans-q">${esc(qText)}</div>` : ""}${body}</div>`;
}

// API validation errors arrive as [{loc, msg}]. Show one "where: what" line each.
function errorText(data) {
  const d = data.detail ?? data;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(e => `${(e.loc || []).filter(p => p !== "body").join(".")}: ${e.msg}`).join("\n");
  return JSON.stringify(d, null, 2);
}

async function run() {
  let req;
  try { req = currentRequest(); } catch (e) { $("#out").innerHTML = `<div class="err">Invalid JSON: ${esc(e.message)}</div>`; return; }
  const btn = $("#run");
  btn.disabled = true; btn.textContent = "Running…";
  const t0 = performance.now();
  let status = 0, data;
  try {
    const r = await fetch("/api/systemone", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(req) });
    status = r.status;
    const text = await r.text();
    try { data = JSON.parse(text); } catch { data = { raw: text }; }
  } catch (e) {
    data = { detail: "Could not reach the local server. Is server.py running?" };
  }
  const ms = Math.round(performance.now() - t0);
  btn.disabled = false; btn.textContent = "Run";

  const raw = `<details><summary>Request JSON</summary><pre class="json">${highlight(req)}</pre></details>
    <details><summary>Response JSON</summary><pre class="json">${highlight(data)}</pre></details>`;
  if (status !== 200) {
    $("#out").innerHTML = `<div class="meta"><span>HTTP <b class="lo">${status || "error"}</b></span><span>${ms} ms</span></div>
      <div class="err">${esc(errorText(data))}</div>${raw}`;
    return;
  }
  const answers = Object.entries(data.answers || {}).map(([id, a]) => renderAnswer(id, a, req.questions?.[id])).join("");
  $("#out").innerHTML = `<div class="meta"><span>Model <b>${esc(data.model || req.model)}</b></span><span><b>${ms}</b> ms</span>
    <span>Tokens <b>${data.usage?.input_tokens ?? "?"}</b> in, <b>${data.usage?.output_tokens ?? "?"}</b> out</span></div>
    ${answers || `<div class="empty">No answers returned.</div>`}${raw}`;
}

function ensureModel(name) {
  const sel = $("#model");
  if (![...sel.options].some(o => o.value === name)) sel.add(new Option(name, name));
  sel.value = name;
}

async function loadModels() {
  try {
    const r = await fetch("/api/models");
    const { models } = await r.json();
    const sel = $("#model"), cur = sel.value;
    sel.innerHTML = "";
    for (const m of models) sel.add(new Option(m.name, m.name, false, m.name === cur));
    sel.title = models.map(m => `${m.name}: ${m.description}`).join("\n");
  } catch {}
}

const presetSel = $("#preset");
for (const name of Object.keys(PRESETS)) presetSel.add(new Option(name, name));
presetSel.onchange = () => {
  const req = PRESETS[presetSel.value];
  if (jsonMode) $("#json").value = JSON.stringify({ ...req, model: $("#model").value }, null, 2);
  loadRequest(req);
};
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => newQuestion(b.dataset.add));
$("#run").onclick = run;
